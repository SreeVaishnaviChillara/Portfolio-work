<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sree Vaishnavi Chillara – VFX Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #fff4f4;
      color: #4d4d4d;
    }
    header {
      background: linear-gradient(to right, #ffd6e0, #e0bbff);
      padding: 2rem;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
      color: #5a3e36;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
      padding: 2.5rem;
    }

    .card {
      background: #fff8fc;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
    }

    .card video {
      width: 100%;
      display: block;
    }

    .card-title {
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      color: #b85c7e;
      background: #ffe6f0;
    }

    iframe {
      width: 100%;
      height: 220px;
      border: none;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>

<header>
  <em>🎨 Sree Vaishnavi Chillara – Visual Effects Portfolio ✨</em>
  <p style="font-size:1rem; font-weight:normal;">Clean previews • Soft pastels • Visual storytelling ✨</p>
</header>

<section class="grid">

  <div class="card">
    <video controls poster="">
      <source src="daytonight.mp4" type="video/mp4">
    </video>
    <div class="card-title">Day to Night 🌙</div>
  </div>

  <div class="card">
    <video controls>
      <source src="cgcompositing.mp4" type="video/mp4">
    </video>
    <div class="card-title">CG Compositing 🧊</div>
  </div>

  <div class="card">
    <video controls>
      <source src="paintcleanup.mp4" type="video/mp4">
    </video>
    <div class="card-title">Paint Cleanup 🎨</div>
  </div>

  <div class="card">
    <video controls>
      <source src="roto.mp4" type="video/mp4">
    </video>
    <div class="card-title">Roto ✂️</div>
  </div>

  <div class="card">
    <video controls>
      <source src="keying.mp4" type="video/mp4">
    </video>
    <div class="card-title">Keying 🔑</div>
  </div>

  <div class="card">
    <iframe src="https://www.youtube.com/embed/krzeTttqiFI" allowfullscreen></iframe>
    <div class="card-title">ParentGeenee – Live Project 🚀</div>
  </div>

  <div class="card">
    <video controls>
      <source src="cgknights.mp4" type="video/mp4">
    </video>
    <div class="card-title">CG Knights – Team Project 🛡️</div>
  </div>

</section>

<footer>
  © 2026 • Sree Vaishnavi Chillara • Visual Effects Portfolio
</footer>

</body>
</html>
